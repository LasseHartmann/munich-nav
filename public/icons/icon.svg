<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0065ae"/>
      <stop offset="100%" stop-color="#00a984"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <!-- Multi-stop route spine -->
  <path d="M148 364 C 148 256, 364 256, 364 148" fill="none" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
  <!-- Origin dot -->
  <circle cx="148" cy="364" r="38" fill="#10b981" stroke="#ffffff" stroke-width="14"/>
  <!-- Intermediate stop dot -->
  <circle cx="256" cy="256" r="34" fill="#f59e0b" stroke="#ffffff" stroke-width="14"/>
  <!-- Destination dot -->
  <circle cx="364" cy="148" r="38" fill="#f43f5e" stroke="#ffffff" stroke-width="14"/>
</svg>
