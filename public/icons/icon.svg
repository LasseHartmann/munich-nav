<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#eb0000"/>
  <!-- Swiss transit horizontal connection bar -->
  <line x1="118" y1="256" x2="394" y2="256" stroke="#ffffff" stroke-width="34" stroke-linecap="round"/>
  <!-- Origin hollow circle -->
